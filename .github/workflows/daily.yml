name: Bahis Sinyal Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan veya update"
        required: false
        default: scan
  schedule:
    - cron: '0 9 * * *'
    - cron: '30 21 * * *'

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 21 * * *' && 'update' || 'scan') }}
        run: python main.py

      - name: Save new results
        if: success()
        run: |
          git config user.name "bahis-bot"
          git config user.email "bot@local"
          git add futbol_data/canli_eklenen.csv || true
          git diff --cached --quiet || git commit -m "gun sonu sonuclar"
          git push || true
