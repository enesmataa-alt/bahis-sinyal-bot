name: Bahis Sinyal Bot

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "30 23 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan veya update"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - update

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas numpy requests

      - name: Pick mode
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
              echo "mode=scan" >> $GITHUB_OUTPUT
            else
              echo "mode=update" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Run the bot
        env:
          MODE: ${{ steps.pick.outputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py

      - name: Commit signal and live files
        if: always()
        run: |
          git config user.name "sinyal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add futbol_data/son_sinyaller.csv futbol_data/canli_eklenen.csv || true
          if git diff --cached --quiet; then
            echo "commit yok"
          else
            git commit -m "bot data ${{ steps.pick.outputs.mode }}"
            git push
          fi
