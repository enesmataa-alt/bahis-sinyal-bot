name: Bahis Sinyal Bot

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan veya update"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - update

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas numpy requests

      - name: Pick mode
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR="${{ github.event.schedule }}"
            if [ "$HOUR" = "30 21 * * *" ]; then
              echo "mode=update" >> $GITHUB_OUTPUT
            else
              echo "mode=scan" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Run the bot
        env:
          MODE: ${{ steps.pick.outputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
